name: Phase 1 + Phase 2 checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_phase1.py --seed 42 --out data/phase1
      - run: python scripts/validate_phase1.py --data data/phase1
      - run: python tests/test_planner.py
      - run: python scripts/run_benchmark.py --data data/phase1
