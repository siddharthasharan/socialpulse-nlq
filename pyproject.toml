[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-replica"
version = "0.1.0"
description = "Independent synthetic natural-language product analytics project (Phase 1: data foundation)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15",
]
