[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialpulse-nlq"
version = "0.2.0"
description = "Independent synthetic natural-language product analytics project (Phase 2: deterministic planner + local web UI)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15",
]
